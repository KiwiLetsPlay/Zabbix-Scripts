zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: 9bcbd0cbeb91488aa0ec70f06e176d16
    name: Templates/Homelab
  templates:
  - uuid: 79f777413b264768bf1f20c854740f4e
    template: Homelab Linux extras
    name: Homelab Linux extras
    description: Erreichbarkeit, Updates (mit Liste und Update-Knopf), Download/Upload live und Speedtest (UserParameter aus install.sh)
    groups:
    - name: Templates/Homelab
    items:
    - uuid: 8bcd2f6c5afa43879455ef9fa6967c40
      name: Homelab alive
      key: vfs.file.exists[/proc/uptime]
      delay: 10s
      history: 7d
      trends: '0'
      description: Liefert immer 1 (laeuft auf jedem Agent, auch Container, Home Assistant und Proxmox). Bleibt der Wert aus, ist der Server nicht erreichbar.
      tags:
      - tag: component
        value: availability
      triggers:
      - uuid: 2d6a04ca70474f83baa017d9e9193adb
        expression: nodata(/Homelab Linux extras/vfs.file.exists[/proc/uptime],30s)=1
        name: '{HOST.NAME}: Server nicht erreichbar'
        priority: DISASTER
        description: Seit 30 Sekunden keine Antwort vom Agent.
    - uuid: 93e8c4a02b874911ab4f393f5cef0359
      name: Download live
      key: homelab.net.rx
      delay: 1m
      value_type: FLOAT
      units: bps
      history: 30d
      trends: 365d
      description: Aktuelle Empfangsrate der Netzwerkkarte mit Standardroute, jede Minute
      preprocessing:
      - type: CHANGE_PER_SECOND
        parameters:
        - ''
      - type: MULTIPLIER
        parameters:
        - '8'
      tags:
      - tag: component
        value: network
    - uuid: 84a5ad9215e543d8a35e00522c554913
      name: Upload live
      key: homelab.net.tx
      delay: 1m
      value_type: FLOAT
      units: bps
      history: 30d
      trends: 365d
      description: Aktuelle Senderate der Netzwerkkarte mit Standardroute, jede Minute
      preprocessing:
      - type: CHANGE_PER_SECOND
        parameters:
        - ''
      - type: MULTIPLIER
        parameters:
        - '8'
      tags:
      - tag: component
        value: network
    - uuid: 8f633254193343f88f13b98053b3d78b
      name: Pending updates
      key: updates.count
      delay: 1h
      history: 30d
      trends: 90d
      description: Anzahl installierbarer Paket-Updates
      tags:
      - tag: component
        value: updates
      triggers:
      - uuid: 97633f1233404fdf975d319c638a123e
        expression: min(/Homelab Linux extras/updates.count,#2)>0
        name: '{HOST.NAME}: {ITEM.LASTVALUE} Updates verfuegbar: {?last(/Homelab Linux extras/updates.list)}'
        priority: AVERAGE
        description: Auf dem Server stehen Updates an.
    - uuid: e73016ebb17b4fef9d1f12c81986e6eb
      name: Pending security updates
      key: updates.security
      delay: 1h
      history: 30d
      trends: 90d
      tags:
      - tag: component
        value: updates
      triggers:
      - uuid: af8cceb568ad4d29bd87e63c504615cd
        expression: min(/Homelab Linux extras/updates.security,#2)>0
        name: '{HOST.NAME}: {ITEM.LASTVALUE} Sicherheits-Updates verfuegbar: {?last(/Homelab Linux extras/updates.list)}'
        priority: HIGH
    - uuid: a3e0071e4495451f84961f712e50659d
      name: Reboot required
      key: updates.reboot
      delay: 1h
      history: 30d
      trends: 90d
      description: 1 = Neustart nach Updates noetig
      tags:
      - tag: component
        value: updates
      triggers:
      - uuid: 4a4898d6fa724b27b7e8b3fa4a8a4e0e
        expression: min(/Homelab Linux extras/updates.reboot,#2)=1
        name: '{HOST.NAME}: Neustart noetig'
        priority: WARNING
    - uuid: fe97dcfaaed7473a962352f76c4573f8
      name: Speedtest (Maximum) download
      key: speedtest.download
      delay: 30m
      value_type: FLOAT
      units: bps
      history: 90d
      trends: 365d
      tags:
      - tag: component
        value: speedtest
      triggers:
      - uuid: 60f3da4332c648859fc3fa008bfbac57
        expression: max(/Homelab Linux extras/speedtest.download,#2)<{$SPEEDTEST.DOWN.MIN}
        name: '{HOST.NAME}: Internet-Download niedrig ({ITEM.LASTVALUE})'
        priority: WARNING
    - uuid: 11ab9e19e31b403488157b331a797064
      name: Speedtest (Maximum) upload
      key: speedtest.upload
      delay: 30m
      value_type: FLOAT
      units: bps
      history: 90d
      trends: 365d
      tags:
      - tag: component
        value: speedtest
    - uuid: 5fc620563a5045688f1d531e54184372
      name: Speedtest (Maximum) ping
      key: speedtest.ping
      delay: 30m
      value_type: FLOAT
      units: ms
      history: 90d
      trends: 365d
      tags:
      - tag: component
        value: speedtest
    - uuid: 3f9b0a67c6ac4492af6edb05ee4325f8
      name: Pending updates list
      key: updates.list
      delay: 1h
      value_type: TEXT
      trends: '0'
      history: 7d
      description: Namen der offenen Updates. Ein * hinter dem Namen bedeutet Sicherheits-Update.
      tags:
      - tag: component
        value: updates
    - uuid: 9fc5bdaf928b4dc588a0d2d27331938a
      name: Update status
      key: homelab.update.status
      delay: 1m
      value_type: TEXT
      trends: '0'
      history: 7d
      description: Status des ueber den Zabbix-Knopf gestarteten Updates (LAEUFT / Ende / Neustart noetig).
      tags:
      - tag: component
        value: updates
    macros:
    - macro: '{$SPEEDTEST.DOWN.MIN}'
      value: '10000000'
      description: Mindest-Download in bit/s (10000000 = 10 Mbit/s)
