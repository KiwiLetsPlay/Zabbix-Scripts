zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 9bcbd0cbeb91488aa0ec70f06e176d16
      name: Templates/Homelab
  templates:
    - uuid: 79f777413b264768bf1f20c854740f4e
      template: Homelab Linux extras
      name: Homelab Linux extras
      description: Offene Updates und Neustart-Hinweis (per UserParameter aus install.sh)
      groups:
        - name: Templates/Homelab
      items:
        - uuid: 8f633254193343f88f13b98053b3d78b
          name: Pending updates
          key: updates.count
          delay: 1h
          history: 30d
          trends: 90d
          description: Anzahl installierbarer Paket-Updates
          tags:
            - tag: component
              value: updates
          triggers:
            - uuid: 97633f1233404fdf975d319c638a123e
              expression: 'min(/Homelab Linux extras/updates.count,#2)>0'
              name: '{HOST.NAME}: {ITEM.LASTVALUE} Updates verfuegbar'
              priority: AVERAGE
              description: Auf dem Server stehen Updates an.
        - uuid: e73016ebb17b4fef9d1f12c81986e6eb
          name: Pending security updates
          key: updates.security
          delay: 1h
          history: 30d
          trends: 90d
          tags:
            - tag: component
              value: updates
          triggers:
            - uuid: af8cceb568ad4d29bd87e63c504615cd
              expression: 'min(/Homelab Linux extras/updates.security,#2)>0'
              name: '{HOST.NAME}: {ITEM.LASTVALUE} Sicherheits-Updates verfuegbar'
              priority: HIGH
        - uuid: a3e0071e4495451f84961f712e50659d
          name: Reboot required
          key: updates.reboot
          delay: 1h
          history: 30d
          trends: 90d
          description: 1 = Neustart nach Updates noetig
          tags:
            - tag: component
              value: updates
          triggers:
            - uuid: 4a4898d6fa724b27b7e8b3fa4a8a4e0e
              expression: 'min(/Homelab Linux extras/updates.reboot,#2)=1'
              name: '{HOST.NAME}: Neustart noetig'
              priority: WARNING
