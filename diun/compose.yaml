# Diun meldet per Telegram, wenn es fuer deine Docker-Images eine neue Version gibt.
# Lege neben diese Datei eine .env mit:
#   TELEGRAM_TOKEN=...      (Bot-Token)
#   TELEGRAM_CHAT_ID=...    (deine Chat-ID)
services:
  diun:
    image: crazymax/diun:latest
    command: serve
    restart: always
    volumes:
      - "./data:/data"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    environment:
      - "TZ=Europe/Berlin"
      - "DIUN_WATCH_SCHEDULE=0 7 * * *"
      - "DIUN_PROVIDERS_DOCKER=true"
      - "DIUN_PROVIDERS_DOCKER_WATCHBYDEFAULT=true"
      - "DIUN_NOTIF_TELEGRAM_TOKEN=${TELEGRAM_TOKEN}"
      - "DIUN_NOTIF_TELEGRAM_CHATIDS=${TELEGRAM_CHAT_ID}"
